name: Docker CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # required for github container registry

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Set up test database
        run: |
          # Wait for postgres to be fully ready with retry loop
          for i in $(seq 1 30); do
            if PGPASSWORD=test psql -h localhost -p 5432 -U test -d postgres -c "SELECT 1" > /dev/null 2>&1; then
              echo "Postgres ready after ${i} attempts"
              break
            fi
            echo "Waiting for postgres... attempt $i/30"
            sleep 2
          done
          # Create dummy user and database (matches vitest.config.mjs DATABASE_URL)
          PGPASSWORD=test psql -h localhost -p 5432 -U test -d postgres -c "SELECT 1 FROM pg_roles WHERE rolname='dummy'" | grep -q '1' || \
            PGPASSWORD=test psql -h localhost -p 5432 -U test -d postgres -c "CREATE USER dummy WITH PASSWORD 'dummy' CREATEDB;"
          PGPASSWORD=test psql -h localhost -p 5432 -U test -d postgres -c "SELECT 1 FROM pg_database WHERE datname='dummy'" | grep -q '1' || \
            PGPASSWORD=test psql -h localhost -p 5432 -U test -d postgres -c "CREATE DATABASE dummy OWNER dummy;"
          # Push schema to dummy database (uses dummy user credentials)
          DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" npx prisma db push --skip-generate --accept-data-loss --no-color

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA
          CLERK_SECRET_KEY: sk_test_dummy

      - name: Run tests
        run: npm run test:ci
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA
          CLERK_SECRET_KEY: sk_test_dummy
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
