# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: Check for pending Prisma migrations
      env:
        DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
        SHADOW_DATABASE_URL: ${{ secrets.CI_SHADOW_DATABASE_URL }}
      run: |
        if [ -z "$SHADOW_DATABASE_URL" ]; then
          echo "SHADOW_DATABASE_URL is not set. Skipping migration check."
        else
          # Fail if schema.prisma differs from migrations on disk
          npx prisma migrate diff --from-migrations ./prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
        fi
    - name: Generate Prisma client
      run: npx prisma generate
    - name: Install psql client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Set up test database
      run: |
        # Wait for postgres to be fully ready with retry loop
        for i in $(seq 1 30); do
          if PGPASSWORD=test psql -h localhost -p 5432 -U test -d postgres -c "SELECT 1" > /dev/null 2>&1; then
            echo "Postgres ready after ${i} attempts"
            break
          fi
          echo "Waiting for postgres... attempt $i/30"
          sleep 2
        done
        # Create dummy user and database (matches vitest.config.mjs DATABASE_URL)
        PGPASSWORD=test psql -h localhost -p 5432 -U test -d postgres -c "SELECT 1 FROM pg_roles WHERE rolname='dummy'" | grep -q '1' || \
          PGPASSWORD=test psql -h localhost -p 5432 -U test -d postgres -c "CREATE USER dummy WITH PASSWORD 'dummy' CREATEDB;"
        PGPASSWORD=test psql -h localhost -p 5432 -U test -d postgres -c "SELECT 1 FROM pg_database WHERE datname='dummy'" | grep -q '1' || \
          PGPASSWORD=test psql -h localhost -p 5432 -U test -d postgres -c "CREATE DATABASE dummy OWNER dummy;"
        # Push schema to dummy database (uses dummy user credentials)
        DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" npx prisma db push --skip-generate --accept-data-loss --no-color
    - run: npx playwright install --with-deps chromium
    - name: Run tests
      run: npm run test:unit
      env:
        NODE_ENV: test
        DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    - run: npm run build --if-present
      env:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA
        CLERK_SECRET_KEY: sk_test_dummy
    - run: npm run test:e2e
      env:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA
        CLERK_SECRET_KEY: sk_test_dummy
        DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
